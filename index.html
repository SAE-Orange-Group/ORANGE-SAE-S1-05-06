<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orange • Modern Experience</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --orange-primary: #ff6600;
            --orange-hover: #ff7d26;
            --orange-gradient: linear-gradient(135deg, #ff8c00 0%, #ff4b00 100%);
            --orange-glow: rgba(255, 102, 0, 0.35);
            --bg-dark: #090a0f;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border-glass: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- NAVBAR FLOTTANTE & GLASSMORPHISM --- */
        .navbar-custom {
            background: rgba(14, 16, 26, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            margin: 1.2rem auto;
            padding: 0.75rem 1.5rem;
            max-width: 1200px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        /* Logo Brand */
        .navbar-brand {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -0.5px;
            background: var(--orange-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-dot {
            width: 9px;
            height: 9px;
            background: var(--orange-primary);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--orange-primary);
            display: inline-block;
        }

        /* Liens de Navigation */
        .nav-link {
            color: rgba(255, 255, 255, 0.7) !important;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.5rem 1rem !important;
            border-radius: 12px;
            transition: all 0.25s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: #ffffff !important;
            background: rgba(255, 255, 255, 0.06);
        }

        /* Boutons personnalisés du menu */
        .btn-nav-custom {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            color: #e0e0e0;
            font-weight: 500;
            font-size: 0.9rem;
            border-radius: 10px;
            padding: 0.45rem 1.1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-nav-custom:hover {
            border-color: var(--orange-primary);
            color: #fff;
            background: rgba(255, 102, 0, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px var(--orange-glow);
        }

        /* Barre de Recherche */
        .search-container {
            position: relative;
        }

        .search-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: 30px;
            color: #ffffff;
            font-size: 0.88rem;
            padding: 0.5rem 1.2rem 0.5rem 2.4rem;
            transition: all 0.3s ease;
            width: 170px;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.09);
            border-color: var(--orange-primary);
            box-shadow: 0 0 15px var(--orange-glow);
            width: 220px;
            color: #fff;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            pointer-events: none;
        }

        /* Bouton Action Principal */
        .btn-orange-gradient {
            background: var(--orange-gradient);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 30px;
            padding: 0.5rem 1.3rem;
            box-shadow: 0 4px 18px var(--orange-glow);
            transition: all 0.3s ease;
        }

        .btn-orange-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 102, 0, 0.55);
            color: #fff;
        }

        /* --- HERO SECTION DE DEMO (Effet Waouh) --- */
        .hero {
            position: relative;
            padding: 100px 0 60px;
            text-align: center;
        }

        /* Halo lumineux d'arrière-plan */
        .glow-orb {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 350px;
            background: radial-gradient(circle, rgba(255,102,0,0.22) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            filter: blur(50px);
        }

        .badge-pill {
            background: rgba(255, 102, 0, 0.12);
            border: 1px solid rgba(255, 102, 0, 0.3);
            color: #ff944d;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 1.5rem;
        }

        .hero-title {
            font-size: clamp(2.5rem, 5vw, 4.2rem);
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1px;
            margin-bottom: 1.2rem;
        }

        .text-gradient {
            background: var(--orange-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            color: #9aa0a6;
            font-size: 1.15rem;
            max-width: 600px;
            margin: 0 auto 2rem;
        }
    </style>
</head>
<body>

    <!-- Halo lumineux en arrière-plan -->
    <div class="glow-orb"></div>

    <!-- NAVBAR MAGNIFIQUE -->
    <div class="container-fluid px-3">
        <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
            <div class="container-fluid">
                
                <!-- Logo Marque -->
                <a class="navbar-brand" href="#">
                    <span class="brand-dot"></span>
                    Orange
                </a>

                <!-- Bouton Mobile Burger -->
                <button class="navbar-toggler border-0 text-light shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <i class="bi bi-list fs-2 text-white"></i>
                </button>

                <!-- Menu et Actions -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <!-- Liens Centrés -->
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1 gap-lg-2">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">
                                <i class="bi bi-house-door me-1"></i> Home
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-nav-custom d-block" href="#">Découvrir</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-nav-custom d-block" href="#">Services</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-nav-custom d-block" href="#">Tarifs</a>
                        </li>
                    </ul>

                    <!-- Recherche + Action Droite -->
                    <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                        <form class="search-container" role="search">
                            <i class="bi bi-search search-icon"></i>
                            <input class="form-control search-input" type="search" placeholder="Rechercher..." aria-label="Search" />
                        </form>

                        <button class="btn btn-orange-gradient">
                            Connexion
                        </button>
                    </div>

                </div>
            </div>
        </nav>
    </div>

    <!-- HERO SECTION (Aperçu du rendu) -->
    <section class="hero container">
        <div class="badge-pill">
            <i class="bi bi-stars"></i> Design Futuriste & Épuré
        </div>
        <h1 class="hero-title">
            L'excellence visuelle <br>
            au service de <span class="text-gradient">vos projets</span>
        </h1>
        <p class="hero-desc">
            Une interface pensée pour la modernité avec un style glassmorphism subtil, des animations fluides et une palette de couleurs dynamique.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <button class="btn btn-orange-gradient btn-lg px-4 py-2 fs-6">
                Commencer maintenant <i class="bi bi-arrow-right ms-2"></i>
            </button>
            <button class="btn btn-nav-custom btn-lg px-4 py-2 fs-6">
                En savoir plus
            </button>
        </div>
    </section>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
